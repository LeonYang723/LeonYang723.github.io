<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 臉部辨識門鎖</title>

  <script src="./face-api.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      text-align: center;
      padding: 16px;
    }

    h2, h3 {
      margin-bottom: 12px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin: 5px;
      width: 260px;
      max-width: 90%;
      font-size: 15px;
    }

    .panel {
      background: white;
      padding: 18px;
      border-radius: 15px;
      max-width: 430px;
      margin: 14px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .note {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
      line-height: 1.5;
    }

    .step-label {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 8px;
    }

    #mainSystem {
      display: none;
    }

    .sticky-buttons {
      position: sticky;
      top: 0;
      z-index: 999;
      background: #f2f2f2;
      padding: 8px 0;
      margin-bottom: 10px;
    }

    #videoContainer {
      position: relative;
      width: 360px;
      max-width: 95%;
      margin: auto;
      background: black;
      border-radius: 10px;
      overflow: hidden;
    }

    video, canvas {
      width: 100%;
    }

    canvas#overlay {
      position: absolute;
      top: 0;
      left: 0;
    }

    #status {
      margin-top: 15px;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-line;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      font-size: 14px;
    }

    th {
      background: #007bff;
      color: white;
    }

    #chartContainer {
      width: 360px;
      max-width: 95%;
      margin: 30px auto;
    }
  </style>
</head>

<body>

<h2>🔐 臉部辨識智慧門鎖</h2>

<!-- Step 1: Registration -->
<div id="registerStep" class="panel">
  <div class="step-label">Step 1 註冊資料</div>
  <h3>📸 使用者臉部資料註冊</h3>

  <input type="text" id="registerNameInput" placeholder="請輸入姓名，例如 Leon">
  <br>

  <input type="email" id="registerEmailInput" placeholder="請輸入 Gmail">
  <br>

  <input type="file" id="registerFaceInput" accept="image/*">
  <br>

  <button id="submitRegisterBtn">送出註冊資料</button>
  <button id="skipRegisterBtn" style="background:#6c757d;">略過註冊，直接進入辨識</button>

  <div class="note">
    註冊後會將姓名、Email 與 128 維臉部特徵向量寫入 Google Sheet，並同步暫存於瀏覽器。<br>
    建議正式使用時搭配 Google Sheet 的 approved 狀態欄位，由管理者審核後才允許開鎖。
  </div>
</div>

<!-- Step 2: Face recognition + BLE + OTP -->
<div id="mainSystem">
  <div class="panel">
    <div class="step-label">Step 2 人臉辨識與開鎖</div>
    <h3>🧠 人臉辨識系統</h3>
    <div class="note">
      請先連接 ESP32，再開始辨識。辨識成功後，系統會要求 Email OTP 二次驗證。
    </div>
  </div>

  <div class="sticky-buttons">
    <button id="connectBtn">🔗 連接 ESP32</button>
    <button id="identifyBtn" disabled>🧠 開始辨識</button>
  </div>

  <div class="panel" id="otpPanel" style="display:none;">
    <h3>📧 Email 二次驗證</h3>

    <input type="email" id="emailInput" placeholder="請輸入註冊 Gmail">
    <br>

    <button id="sendOtpBtn">寄送驗證碼</button>

    <br>

    <input type="text" id="otpInput" placeholder="請輸入 6 位數驗證碼">

    <br>

    <button id="verifyOtpBtn">確認驗證並開鎖</button>

    <div class="note">
      系統會確認此 Email 是否與辨識到的人臉資料相符，再寄送驗證碼。
    </div>
  </div>

  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="chartContainer">
    <canvas id="scoreChart"></canvas>
  </div>

  <div style="max-width:700px;margin:auto;">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>辨識對象</th>
          <th>相似度</th>
          <th>結果</th>
        </tr>
      </thead>

      <tbody id="resultTableBody"></tbody>
    </table>
  </div>
</div>

<div id="status">📦 模型載入中...</div>

<script>
/*
  重要：
  1. APPS_SCRIPT_URL 請替換成你部署後的 Google Apps Script Web App URL。
  2. Google Sheet 需建立欄位：
     Time | Name | Email | Descriptor | Status
  3. Apps Script 後端需使用我提供的整合版程式碼。
*/
const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyh2XA4p67jsKKhfvPTq5q0eowWlCPgNJZZrobdI85SS4xj-xFhLbV7Zs8SxQ0rEB1YrQ/exec";

const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const MATCH_THRESHOLD = 0.4;

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const statusEl = document.getElementById("status");
const resultTableBody = document.getElementById("resultTableBody");

const registerStep = document.getElementById("registerStep");
const mainSystem = document.getElementById("mainSystem");

const registerNameInput = document.getElementById("registerNameInput");
const registerEmailInput = document.getElementById("registerEmailInput");
const registerFaceInput = document.getElementById("registerFaceInput");
const submitRegisterBtn = document.getElementById("submitRegisterBtn");
const skipRegisterBtn = document.getElementById("skipRegisterBtn");

const connectBtn = document.getElementById("connectBtn");
const identifyBtn = document.getElementById("identifyBtn");

const otpPanel = document.getElementById("otpPanel");
const emailInput = document.getElementById("emailInput");
const otpInput = document.getElementById("otpInput");
const sendOtpBtn = document.getElementById("sendOtpBtn");
const verifyOtpBtn = document.getElementById("verifyOtpBtn");

let UARTService;
let knownDescriptors = [];
let pendingUnlock = false;
let pendingLabel = "";
let pendingEmail = "";
let indexCounter = 1;

const chart = new Chart(
  document.getElementById("scoreChart"),
  {
    type: "line",
    data: {
      labels: [],
      datasets: [{
        label: "Similarity Score",
        data: [],
        borderColor: "blue",
        backgroundColor: "blue",
        fill: false,
        pointRadius: 5,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      scales: {
        x: { title: { display: true, text: "Index" } },
        y: { beginAtZero: true, max: 1 }
      }
    }
  }
);

async function loadModels() {
  try {
    statusEl.textContent = "📦 載入模型中...";

    await faceapi.nets.tinyFaceDetector.loadFromUri("./models");
    await faceapi.nets.faceLandmark68Net.loadFromUri("./models");
    await faceapi.nets.faceRecognitionNet.loadFromUri("./models");

    await loadReferenceFaces();
    loadLocalRegisteredFaces();

    statusEl.textContent =
      `✅ 模型載入完成，目前共 ${knownDescriptors.length} 筆臉部資料`;
  } catch (error) {
    console.error(error);
    statusEl.textContent = "❌ 模型載入失敗，請確認 models 路徑";
  }
}

async function loadReferenceFaces() {
  const labels = ["1", "2", "3", "4"];

  for (let label of labels) {
    try {
      const img = await faceapi.fetchImage(`./faces/${label}.jpg`);

      const detection =
        await faceapi
        .detectSingleFace(
          img,
          new faceapi.TinyFaceDetectorOptions({
            inputSize: 224,
            scoreThreshold: 0.3
          })
        )
        .withFaceLandmarks()
        .withFaceDescriptor();

      if (detection) {
        knownDescriptors.push({
          label: label,
          email: "",
          descriptor: detection.descriptor,
          source: "github"
        });
      }
    } catch (err) {
      console.warn(`無法載入參考照片 ${label}.jpg`, err);
    }
  }
}

function loadLocalRegisteredFaces() {
  try {
    const savedUsers =
      JSON.parse(localStorage.getItem("registeredUsers") || "[]");

    savedUsers.forEach(user => {
      knownDescriptors.push({
        label: user.name,
        email: user.email,
        descriptor: new Float32Array(user.descriptor),
        source: "localStorage"
      });
    });
  } catch (error) {
    console.error(error);
    localStorage.removeItem("registeredUsers");
  }
}

function goToMainSystem() {
  registerStep.style.display = "none";
  mainSystem.style.display = "block";
  statusEl.textContent =
    `✅ 已進入辨識頁面，目前共 ${knownDescriptors.length} 筆臉部資料`;
}

async function submitRegistration() {
  const name = registerNameInput.value.trim();
  const email = registerEmailInput.value.trim().toLowerCase();
  const file = registerFaceInput.files[0];

  if (!name || !email || !file) {
    alert("請輸入姓名、Gmail，並選擇一張人臉照片");
    statusEl.textContent = "❌ 註冊資料不完整";
    return;
  }

  statusEl.textContent = "📸 正在讀取照片並擷取 128 維臉部特徵...";

  try {
    const img = await faceapi.bufferToImage(file);

    const detection =
      await faceapi
      .detectSingleFace(
        img,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 224,
          scoreThreshold: 0.3
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (!detection) {
      alert("這張照片未偵測到人臉，請換一張清楚正臉照片");
      statusEl.textContent = "❌ 上傳照片未偵測到人臉";
      return;
    }

    const descriptorArray = Array.from(detection.descriptor);

    // 1. 存到 localStorage，供本機辨識使用
    let savedUsers =
      JSON.parse(localStorage.getItem("registeredUsers") || "[]");

    savedUsers = savedUsers.filter(user => user.email !== email);

    savedUsers.push({
      name: name,
      email: email,
      descriptor: descriptorArray
    });

    localStorage.setItem(
      "registeredUsers",
      JSON.stringify(savedUsers)
    );

    // 同步更新目前頁面的 knownDescriptors
    knownDescriptors = knownDescriptors.filter(
      item => !(item.source === "localStorage" && item.email === email)
    );

    knownDescriptors.push({
      label: name,
      email: email,
      descriptor: new Float32Array(descriptorArray),
      source: "localStorage"
    });

    // 2. 寫入 Google Sheet
    statusEl.textContent = "☁️ 正在寫入 Google Sheet...";

    const params = new URLSearchParams();
    params.append("action", "register");
    params.append("name", name);
    params.append("email", email);
    params.append("descriptor", JSON.stringify(descriptorArray));

    const url =
    `${APPS_SCRIPT_URL}?action=register&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&descriptor=${encodeURIComponent(JSON.stringify(descriptorArray))}`;

    const res = await fetch(url);

    const data = await res.json();

    if (!data.ok) {
      alert("本機註冊成功，但 Google Sheet 寫入失敗：" + (data.message || "unknown error"));
      statusEl.textContent =
        `⚠️ 本機註冊成功，但雲端寫入失敗：${data.message || "unknown error"}`;
      goToMainSystem();
      return;
    }

    alert("註冊成功，資料已寫入 Google Sheet");
    statusEl.textContent =
      `✅ 註冊成功：${name} / ${email}\n已寫入 Google Sheet，並暫存於瀏覽器`;

    goToMainSystem();

  } catch (error) {
    console.error(error);
    alert("註冊失敗，請確認照片或 Apps Script 設定");
    statusEl.textContent = "❌ 註冊失敗";
  }
}

async function startVideo() {
  const stream =
    await navigator.mediaDevices.getUserMedia({
      video: true
    });

  video.srcObject = stream;

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    video.play();
    statusEl.textContent = "📷 攝影機已啟動";
  };
}

async function connectBLE() {
  try {
    const device =
      await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [UART_SERVICE]
      });

    const server = await device.gatt.connect();

    UARTService =
      await server.getPrimaryService(UART_SERVICE);

    identifyBtn.disabled = false;

    await startVideo();

    statusEl.textContent = "✅ ESP32 已連接";

  } catch (err) {
    console.error(err);
    statusEl.textContent = "❌ ESP32 連線失敗";
  }
}

async function sendBLE(command) {
  if (!UARTService) {
    statusEl.textContent = "❌ 尚未連接 ESP32";
    return;
  }

  const tx =
    await UARTService.getCharacteristic(RX_UUID);

  await tx.writeValue(
    new TextEncoder().encode(command)
  );
}

async function identifyFace() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pendingUnlock = false;
  pendingLabel = "";
  pendingEmail = "";
  otpPanel.style.display = "none";

  const result =
    await faceapi
    .detectSingleFace(
      video,
      new faceapi.TinyFaceDetectorOptions({
        inputSize: 160,
        scoreThreshold: 0.5
      })
    )
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!result) {
    statusEl.textContent = "❌ 未偵測到人臉";
    return;
  }

  if (knownDescriptors.length === 0) {
    statusEl.textContent = "❌ 尚未載入任何臉部資料";
    return;
  }

  let bestMatch = null;

  for (let item of knownDescriptors) {
    const dist =
      faceapi.euclideanDistance(
        result.descriptor,
        item.descriptor
      );

    if (!bestMatch || dist < bestMatch.dist) {
      bestMatch = {
        label: item.label,
        email: item.email,
        dist: dist
      };
    }
  }

  const success =
    bestMatch.dist < MATCH_THRESHOLD;

  const resized =
    faceapi.resizeResults(
      result,
      {
        width: canvas.width,
        height: canvas.height
      }
    );

  const box = resized.detection.box;

  const drawBox =
    new faceapi.draw.DrawBox(
      {
        x: box.x,
        y: box.y,
        width: box.width,
        height: box.height
      },
      {
        label: `${bestMatch.label} (${bestMatch.dist.toFixed(2)})`,
        boxColor: success ? "green" : "red"
      }
    );

  drawBox.draw(canvas);

  chart.data.labels.push(indexCounter);
  chart.data.datasets[0].data.push(bestMatch.dist);
  chart.update();

  const row = document.createElement("tr");

  row.innerHTML = `
    <td>${indexCounter}</td>
    <td>${bestMatch.label}</td>
    <td>${bestMatch.dist.toFixed(4)}</td>
    <td style="color:${success ? 'green':'red'}">
      ${success ? '待 Email 驗證':'失敗'}
    </td>
  `;

  resultTableBody.appendChild(row);
  indexCounter++;

  if (success) {
    pendingUnlock = true;
    pendingLabel = bestMatch.label;
    pendingEmail = bestMatch.email || "";

    otpPanel.style.display = "block";

    if (pendingEmail) {
      emailInput.value = pendingEmail;
    }

    statusEl.textContent =
      `✅ 人臉辨識成功：${bestMatch.label}\n請完成 Email OTP 驗證`;
  } else {
    await sendBLE("FAIL");
    statusEl.textContent = "❌ 人臉辨識失敗";
  }
}

async function sendOTP() {
  const email = emailInput.value.trim().toLowerCase();

  if (!pendingUnlock) {
    statusEl.textContent = "❌ 請先通過人臉辨識";
    return;
  }

  if (!email) {
    statusEl.textContent = "❌ 請輸入 Email";
    return;
  }

  // 如果此人臉有綁定 email，必須相同
  if (pendingEmail && email !== pendingEmail) {
    statusEl.textContent =
      "❌ Email 與辨識到的人臉資料不相符，拒絕寄送驗證碼";
    return;
  }

  try {
    statusEl.textContent = "📧 驗證碼寄送中...";

    const url =
      `${APPS_SCRIPT_URL}?action=send&email=${encodeURIComponent(email)}&name=${encodeURIComponent(pendingLabel)}`;

    const res = await fetch(url);
    const data = await res.json();

    if (data.ok) {
      statusEl.textContent = "✅ 驗證碼已寄出，請檢查 Gmail";
    } else {
      statusEl.textContent =
        `❌ 寄送失敗：${data.message || "Unknown error"}`;
    }

  } catch (err) {
    console.error(err);
    statusEl.textContent = "❌ Apps Script 錯誤，請確認部署權限";
  }
}

async function verifyOTP() {
  const email = emailInput.value.trim().toLowerCase();
  const otp = otpInput.value.trim();

  if (!pendingUnlock) {
    statusEl.textContent = "❌ 尚無待驗證的解鎖請求";
    return;
  }

  if (!email || !otp) {
    statusEl.textContent = "❌ 請輸入 Email 與驗證碼";
    return;
  }

  if (pendingEmail && email !== pendingEmail) {
    statusEl.textContent =
      "❌ Email 與辨識到的人臉資料不相符";
    return;
  }

  try {
    statusEl.textContent = "🔍 驗證碼確認中...";

    const res =
      await fetch(
        `${APPS_SCRIPT_URL}?action=verify&email=${encodeURIComponent(email)}&otp=${encodeURIComponent(otp)}`
      );

    const data = await res.json();

    if (data.ok) {
      await sendBLE("UNLOCK");

      statusEl.textContent =
        `🔓 Email 驗證成功，${pendingLabel} 已開鎖`;

      pendingUnlock = false;
      otpPanel.style.display = "none";
      otpInput.value = "";
    } else {
      await sendBLE("FAIL");

      statusEl.textContent =
        `❌ 驗證失敗：${data.message || "驗證碼錯誤"}`;
    }

  } catch (err) {
    console.error(err);
    statusEl.textContent = "❌ OTP 驗證失敗，請確認 Apps Script URL";
  }
}

submitRegisterBtn.onclick = submitRegistration;
skipRegisterBtn.onclick = goToMainSystem;

connectBtn.onclick = connectBLE;
identifyBtn.onclick = identifyFace;

sendOtpBtn.onclick = sendOTP;
verifyOtpBtn.onclick = verifyOTP;

loadModels();
</script>

</body>
</html>
